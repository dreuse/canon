name: Docker build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Defaults to the ref that triggered the caller.
        type: string
        required: false
        default: ""
      tags:
        description: docker/metadata-action tag rules.
        type: string
        required: true
      flavor:
        description: docker/metadata-action flavor rules.
        type: string
        required: false
        default: ""

env:
  IMAGE_NAME: ghcr.io/dreuse/canon
  BASE_IMAGE_NAME: ghcr.io/dreuse/canon-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker base meta
        id: base_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Build and push base image
        id: base_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          labels: ${{ steps.base_meta.outputs.labels }}
          tags: ${{ steps.base_meta.outputs.tags }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Build and push with base pinned by digest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}@${{ steps.base_build.outputs.digest }}

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_REF"
